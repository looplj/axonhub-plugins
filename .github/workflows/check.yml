name: Check plugins

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out AxonHub
        uses: actions/checkout@v4
        with:
          repository: looplj/axonhub
          ref: unstable
          path: axonhub
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pack-plugin
        run: go install github.com/looplj/axonhub/cmd/pack-plugin@c2826aa422821d88c717502a72c87395dcdb3cb3
      - name: Test and package plugins
        run: |
          if compgen -G 'axonhub/plugins/community/*/manifest.json' > /dev/null; then
            python3 scripts/plugins.py check --source-root axonhub
          else
            echo "AxonHub unstable has no plugins/community; validating external-plugins.json only"
            python3 -c 'import importlib.util; spec = importlib.util.spec_from_file_location("plugins", "scripts/plugins.py"); mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); mod.read_external([])'
          fi
