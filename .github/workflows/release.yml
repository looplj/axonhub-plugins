name: Release plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must reconcile current main.
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pack-plugin
        run: go install github.com/looplj/axonhub/cmd/pack-plugin@c2826aa422821d88c717502a72c87395dcdb3cb3
      - name: Test and package plugins
        run: python3 scripts/plugins.py check
      - name: Reconcile releases and registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/plugins.py publish
      - name: Publish registry
        run: |
          git add registry.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update plugin registry'
          git push origin HEAD:main
